<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Skills Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        #header {
            display: flex;
            position: relative;
            display: inline;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        #headerimg {
            filter: blur(.7px);
            height: 1100px;
            object-fit: cover;
        }

        #headertext {
            margin: 110px;
            margin-left: 310px;
            margin-right: 310px;
            text-align: center; 
            align-items: center;
            display: flex; 
            justify-content: center;
            height: 100px;
            width: 800px;
            position: absolute;
        }

        #foot {
            background-color: rgb(3, 146, 149);
            color: whitesmoke;
            align-items: center;
            text-align: center;
            width: 1408px;
            border: 3px solid rgb(0, 95, 115);
            border-radius: 5px;
            padding: 10px;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: larger;
        }

        #submit {
            border-radius: 25px;
            border: 3px solid rgb(0, 95, 115);
            background-color: rgb(3, 146, 149);
            color: whitesmoke;
            height: 50px;
            width: 345px;
            margin-left: 375px;
            margin-right: 375px;
        }


        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .form-row {
            display: flex; 
            gap: 15px; 
        }

        .container1 {
            margin: 40px;
            margin-left: 310px;
            margin-right: 310px;
            text-align: center; 
            align-items: center;
            display: flex; 
            justify-content: center;
            height: 100px;
            width: 800px;
            position: absolute;
        }

        .container2 {
            border-radius: 20px;
            background-color: whitesmoke;
            padding: 25px; 
            margin: 200px;
            margin-left: 115px;
            margin-right: 115px;
            text-align: left; 
            align-items: flex-start;
            display: flex; 
            justify-content: center;
            height: 850px;
            width: 1200px;
            border-radius: 20px;
            border: 3px solid rgb(0, 95, 115);
            position: absolute;
            flex-direction: column;
            opacity: .97;
        }

        input, select {
            height: 40px;
            padding: 5px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><img src="https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/7c5f2399-faf0-4b55-abef-0d5a936d20c5/OBMC+-+60TH+LOGO+-+DIAMOND+SLOGAN+-+APPROVED+-+2026+FA_OBMC+-+COLOR+HORIZONTAL.png?format=1500w" alt="OBMC Logo" style="height: 65px; width: 265px;"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mynavbar">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Campuses</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Enroll Now</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact Us</a>
                    </li>
                </ul>
                <form class="d-flex">
                    <button class="btn btn-success" type="button">My Portal</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container-fluid m-0 p-0" id="header">
        <div class="row">
            <div class="col">
                <img src="https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/affba656-d015-4b96-a8ba-3ef5bbbc2c39/OBMC+MONTESSORI+GH+-+AY+2026+FA.jpg" alt="OBMC Image" id="headerimg" class="img-fluid w-100 d-block">
            </div>

            <div class="container1">
                <br>
                <img src="https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/a23158c8-e745-46c5-9df6-a590c69c9c58/OBMC+-+60TH+LOGO+-+DIAMOND+SLOGAN+-+APPROVED+-+2026+FA_OBMC+-+COLOR+VERTICAL.png?format=500w" alt="OBMC Logo" style="height: 100px; width: 90px; padding-right: 15px;">
                <h1 style="padding-top: 10px; color:  rgb(0, 76, 91); font-weight: 600;">OBMC Student Enrollment Form</h1>
            </div>

            <p style="color: rgb(0, 109, 131);" id="headertext">Fill out the form in order to enroll for the upcoming school year.</p>

            <div class="container2">
                <form style="width: 1140px;">
                    <h5 style="font-weight: 600;">Student Information</h1>
                    <br>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstname">First Name:</label>
                            <input type="text" id="firstname" name="firstname" placeholder="First name" required>
                        </div>
                        <div class="form-group">
                            <label for="lastname">Last Name:</label>
                            <input type="text" id="lastname" name="lastname" placeholder="Last name" required>
                        </div>
                    </div>
                    <br>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="bday">Birth Date:</label>
                            <input type="date" id="bday" name="bday" placeholder="MM/DD/YYYY" required>
                        </div>
                        <div class="form-group">
                            <label for="gender">Gender:</label>
                            <select id="gender" name="gender" required>
                                <option value="" disabled selected>Select...</option>
                                <option value="M">Male</option>
                                <option value="F">Female</option>
                                <option value="O">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="grade">Grade Level:</label>
                            <select id="grade" name="grade" required>
                                <option value="" disabled selected>Select...</option>
                                <option value="K">Casa</option>
                                <option value="1">Grade 1</option>
                                <option value="2">Grade 2</option>
                                <option value="3">Grade 3</option>
                                <option value="4">Grade 4</option>
                                <option value="5">Grade 5</option>
                                <option value="6">Grade 6</option>
                                <option value="7">Grade 7</option>
                                <option value="8">Grade 8</option>
                                <option value="9">Grade 9</option>
                                <option value="10">Grade 10</option>
                                <option value="11">Grade 11</option>
                                <option value="12">Grade 12</option>
                            </select>
                        </div>
                    </div>
                    <br><br>

                    <h5 style="font-weight: 600;">Contact Details</h1>
                    <br>
                    <label for="email" class="form-label">Email Address:</label>
                    <br>
                    <input type="email" class="form-control" placeholder="student@gmail.com" required>
                    <br>
                    <label for="number" class="form-label">Contact Number:</label>
                    <br>
                    <input type="tel" class="form-control" placeholder="0000-000-0000" required>
                    <br><br>

                    <h5 style="font-weight: 600;">Other Information:</h1>
                    <br>
                    <div class="form-group">
                        <label for="mode" class="form-label" style="padding-bottom: 5px;">Learning Mode:</label>
                        <label style="display: inline-flex; align-items: center; gap: 10px; line-height: 1; padding-bottom: 10px;">
                            <input type="radio" id="online" name="mode" style="height: 18px; width: 18px;"> Online
                        </label>
                        <label style="display: inline-flex; align-items: center; gap: 10px; line-height: 1;">
                            <input type="radio" id="f2f" name="mode" style="height: 18px; width: 18px;"> Face-to-Face
                        </label>
                    </div>
                    <br>
                    <label style="display: inline-flex; align-items: center; gap: 10px; line-height: 1;">
                        <input type="checkbox" style="display: inline-flex; align-items: center; gap: 10px; line-height: 1; height: 15px; width: 15px;" required> I confirm that the information provided is valid and complete.
                    </label>
                    <br><br>

                    <button type="button" id="submit">Submit Enrollment Form</button>
                </form>
            </div>
        </div>
    </div>
    <footer>
        <p id="foot">@ 2026 OBMC Website | Created by Yanis Concepcion, 9-Sapphire</p>
    </footer> 
</body>
</html>
